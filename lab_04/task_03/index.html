<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Галерея природи</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Галерея природи</h1>
<div class="gallery">
  <div class="viewport">
    <img class="slide" id="photo-1" src="img/photo-1.jpg" alt="Гірське озеро">
    <img class="slide" id="photo-2" src="img/photo-2.jpg" alt="Хвиля">
    <img class="slide" id="photo-3" src="img/photo-3.jpg" alt="Тропічний берег">
    <img class="slide" id="photo-4" src="img/photo-4.jpg" alt="Осінній сад">
    <img class="slide" id="photo-5" src="img/photo-5.jpg" alt="Водоспад">
  </div>
  <nav class="thumbnails" aria-label="Вибір зображення">
    <a href="#photo-1"><img src="img/thumb-1.jpg" alt="Гірське озеро"></a>
    <a href="#photo-2"><img src="img/thumb-2.jpg" alt="Хвиля"></a>
    <a href="#photo-3"><img src="img/thumb-3.jpg" alt="Тропічний берег"></a>
    <a href="#photo-4"><img src="img/thumb-4.jpg" alt="Осінній сад"></a>
    <a href="#photo-5"><img src="img/thumb-5.jpg" alt="Водоспад"></a>
  </nav>
</div>
</body>
</html>
