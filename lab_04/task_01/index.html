<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Картка комп’ютерної миші</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <article class="mouse-card">
        <img class="mouse-image" src="img/mouse.png"
             alt="Чорна дротова комп’ютерна миша">

        <h1 class="mouse-name">TechPoint M100</h1>

        <ul class="mouse-specs">
            <li>Інтерфейс: USB-A</li>
            <li>Тип сенсора: оптичний</li>
            <li>Кількість кнопок: 3</li>
            <li>Колір корпусу: чорний</li>
        </ul>

        <div class="mouse-actions">
            <button class="edit-button" type="button">Edit</button>
            <button class="delete-button" type="button">Delete</button>
        </div>
    </article>
</body>
</html>
