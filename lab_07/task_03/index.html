<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя галерея</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Моя галерея</h1>

    <main class="gallery">
        <figure class="photo">
            <img src="img/photo-1.jpg" alt="Фотокамера на узбережжі">
            <figcaption>Камера на узбережжі</figcaption>
        </figure>

        <figure class="photo">
            <img src="img/photo-2.jpg" alt="Фотокамера на тлі гірського озера">
            <figcaption>Озеро в горах</figcaption>
        </figure>

        <figure class="photo">
            <img src="img/photo-3.jpg" alt="Морська хвиля">
            <figcaption>Хвиля</figcaption>
        </figure>

        <figure class="photo">
            <img src="img/photo-4.jpg" alt="Фотографка серед осінніх дерев">
            <figcaption>Осіння прогулянка</figcaption>
        </figure>

        <figure class="photo">
            <img src="img/photo-5.jpg" alt="Стежка в осінньому саду">
            <figcaption>Сад</figcaption>
        </figure>

        <figure class="photo">
            <img src="img/photo-6.jpg" alt="Водоспад серед зелених скель">
            <figcaption>Водоспад</figcaption>
        </figure>
    </main>
</body>
</html>
